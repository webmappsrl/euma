; oc:8845 — pulizia permanente post PHP2Shell
; upload_progress e' il vettore principale della CVE: resta off per sempre.
session.upload_progress.enabled = off
expose_php = off
; Limiti commisurati ai dati reali (misura 23/10: max upload HTTP ~2,6MB → 16M/32M,
; vedi docs/features/8845-messa-in-sicurezza-php2shell-server-euma/notes.md).
upload_max_filesize = 16M
post_max_size = 32M
memory_limit = 512M
