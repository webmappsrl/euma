; oc:8845 — pool produzione (database.european-mountaineers.eu)
[euma-prod]
user = www-data
group = www-data
; network_mode: host → solo loopback, mai esposto fuori.
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
catch_workers_output = yes
